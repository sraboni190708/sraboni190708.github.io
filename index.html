<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estelle's Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hubot+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a desk top. Greeting + search strip, then one panel per section in an auto-fitting grid.
   Each section gets its own ink colour, used for its label, count and progress bars. */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --sunk:#E3E8EF; --ink:#18202D; --muted:#5B6576; --line:#D5DCE6;
  --c-study:#C77A0A; --c-tools:#0F7C74; --c-resources:#6B4FC8; --c-other:#3D5A99;
  --good:#1C8F5A;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Hubot Sans",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --panel:#181E28; --sunk:#222A37; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2A3342;
  --c-study:#F2A93B; --c-tools:#3CC7B9; --c-resources:#A58BFF; --c-other:#7FA2EA; --good:#4CD392; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --panel:#181E28; --sunk:#222A37; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2A3342;
  --c-study:#F2A93B; --c-tools:#3CC7B9; --c-resources:#A58BFF; --c-other:#7FA2EA; --good:#4CD392; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:inherit}
:focus-visible{outline:3px solid var(--c-other);outline-offset:2px;border-radius:6px}

header{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end}
.hello{display:flex;flex-direction:column;gap:2px;min-width:0}
.when{font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5.5vw,3.4rem);line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.search{position:relative;width:min(320px,100%)}
.search input{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 14px}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 .75rem var(--body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--sunk)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.sec{--c:var(--c-other);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec[data-id="study"]{--c:var(--c-study)} .sec[data-id="tools"]{--c:var(--c-tools)} .sec[data-id="resources"]{--c:var(--c-resources)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead h2{font-family:var(--display);font-weight:400;font-size:1.65rem;margin:0;color:var(--c)}
.count{font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.blurb{margin:-8px 0 0;font-size:.9rem;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item a{display:flex;flex-direction:column;gap:6px;text-decoration:none;padding:12px 14px;border-radius:12px;background:var(--sunk);border:1px solid transparent;transition:border-color .15s,transform .15s}
.item a:hover{border-color:var(--c);transform:translateY(-1px)}
.iname{font-weight:600;line-height:1.3;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.iname .arrow{color:var(--c);font-weight:700;flex:none}
.inote{font-size:.85rem;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:5px}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.pstat{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pstat b{color:var(--ink);font-weight:600}
.pstat .due b{font-weight:800}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:14px;font-size:.88rem;color:var(--muted)}
.empty b{color:var(--ink);font-weight:600}
.none{display:none;text-align:center;color:var(--muted);padding:24px}
footer{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
footer code{font-size:.78rem;background:var(--sunk);padding:1px 6px;border-radius:5px}
@media (max-width:620px){header{grid-template-columns:1fr}.search{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hello"><span class="when" id="when">&nbsp;</span><h1 id="title">Estelle's Desk</h1></div>
    <label class="search"><input id="q" type="search" placeholder="Find a page" aria-label="Find a page" autocomplete="off"><kbd>/</kbd></label>
  </header>
  <main class="grid" id="grid" aria-live="polite"></main>
  <p class="none" id="none">Nothing matches that. Try another word.</p>
  <footer><span>Every page here is its own file. The list lives in <code>hub.json</code>.</span><span id="stamp"></span></footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let HUB=null;

function clock(){
  const d=new Date(),h=d.getHours();
  const part=h<5?"Late night":h<12?"Morning":h<17?"Afternoon":h<21?"Evening":"Night";
  $("#when").textContent=part+" · "+d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}

function progress(item){
  if(!item.progressKey||!item.cards) return null;
  let S=null;try{S=JSON.parse(localStorage.getItem(item.progressKey)||"null");}catch(e){}
  if(!S||!S.box) return {locked:0,seen:0,due:0,fresh:true};
  const now=Date.now(),seen=Object.keys(S.seen||{}).length;
  let locked=0,due=0;
  for(const id in S.seen||{}){const b=S.box[id]||0;if(b>=3)locked++;if(b<6&&((S.due||{})[id]||0)<=now)due++;}
  return {locked,seen,due,fresh:false};
}

function render(){
  const q=$("#q").value.trim().toLowerCase();
  let shown=0;
  $("#grid").innerHTML=HUB.sections.map(sec=>{
    const items=(sec.items||[]).filter(it=>!q||(it.name+" "+(it.note||"")+" "+sec.name).toLowerCase().includes(q));
    if(q&&!items.length) return "";
    shown+=items.length;
    const list=items.length?`<ul class="items">${items.map(it=>{
      const p=progress(it);
      const pr=p?`<div class="prog"><div class="bar" role="img" aria-label="${p.locked} of ${it.cards} locked in"><i style="width:${(p.locked/it.cards*100).toFixed(1)}%"></i></div>
        <div class="pstat">${p.fresh?`<span>${it.cards} cards · not started on this device</span>`:`<span><b>${p.locked}</b>/${it.cards} locked</span><span><b>${p.seen}</b> seen</span>${p.due?`<span class="due"><b>${p.due}</b> due now</span>`:""}`}</div></div>`:"";
      return `<li class="item"><a href="${esc(it.href)}"><span class="iname">${esc(it.name)}<span class="arrow" aria-hidden="true">→</span></span>${it.note?`<span class="inote">${esc(it.note)}</span>`:""}${pr}</a></li>`;
    }).join("")}</ul>`:`<div class="empty"><b>Nothing here yet.</b> Ask Claude to add something to ${esc(sec.name)}, or add an entry to <code>hub.json</code>.</div>`;
    return `<section class="sec" data-id="${esc(sec.id)}"><div class="sechead"><h2>${esc(sec.name)}</h2><span class="count">${(sec.items||[]).length} ${(sec.items||[]).length===1?"page":"pages"}</span></div>${sec.blurb?`<p class="blurb">${esc(sec.blurb)}</p>`:""}${list}</section>`;
  }).join("");
  $("#none").style.display=q&&!shown?"block":"none";
}

async function boot(){
  clock();setInterval(clock,30000);
  try{
    const r=await fetch("hub.json",{cache:"no-cache"});
    HUB=await r.json();
  }catch(e){
    $("#grid").innerHTML=`<div class="empty"><b>The page list didn't load.</b> Check that <code>hub.json</code> is valid JSON, then reload.</div>`;return;
  }
  if(HUB.title){document.title=HUB.title;$("#title").textContent=HUB.title;}
  const n=HUB.sections.reduce((a,s)=>a+(s.items||[]).length,0);
  $("#stamp").textContent=HUB.sections.length+" sections · "+n+" pages";
  render();
}
$("#q").addEventListener("input",render);
addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();}
  else if(e.key==="Escape"&&document.activeElement===$("#q")){$("#q").value="";render();$("#q").blur();}
});
addEventListener("pageshow",()=>{if(HUB)render();});
boot();
</script>
</body>
</html>
