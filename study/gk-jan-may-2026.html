<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GK Brain Install</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column game console. Home = scoreboard + chapter "levels"; Play = single card with 4 big answer slabs. */
:root{
  --bg:#EDEFF8; --surface:#FFFFFF; --sunk:#E1E5F3; --ink:#151A3B; --muted:#5C6386;
  --line:#CDD3EA; --accent:#FFB020; --accent-ink:#2A1D00; --coral:#FF5E5B;
  --good:#16A06A; --good-bg:#DCF5EA; --bad:#D93B3F; --bad-bg:#FCE3E3; --hook-bg:#FFF4D6;
  --display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1330; --surface:#181D45; --sunk:#222859; --ink:#EEF0FF; --muted:#A3A9D3;
  --line:#2E3570; --accent:#FFB82E; --accent-ink:#241800; --coral:#FF7370;
  --good:#3DD497; --good-bg:#123B33; --bad:#FF6B6E; --bad-bg:#45192A; --hook-bg:#3A3317; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1330; --surface:#181D45; --sunk:#222859; --ink:#EEF0FF; --muted:#A3A9D3;
  --line:#2E3570; --accent:#FFB82E; --accent-ink:#241800; --coral:#FF7370;
  --good:#3DD497; --good-bg:#123B33; --bad:#FF6B6E; --bad-bg:#45192A; --hook-bg:#3A3317; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em}
.brand b{color:var(--coral)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.85rem;font-weight:600}
.board{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lvl{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-align:center;font-family:var(--display);line-height:1}
.lvl small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lvl span{font-size:2.2rem;font-weight:800}
.stats{display:flex;flex-direction:column;gap:10px;min-width:0}
.xpbar{height:12px;background:color-mix(in srgb,var(--bg) 22%,transparent);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem}
.chip{background:color-mix(in srgb,var(--bg) 14%,transparent);padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.chip b{color:inherit;font-weight:800}
.chipbtn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.chipbtn:disabled{opacity:.7;cursor:wait}
.chiplink{border:0;background:none;color:inherit;opacity:.75;text-decoration:underline;cursor:pointer}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{border:0;border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--surface);box-shadow:0 2px 0 var(--line);transition:transform .1s}
.mode:hover{transform:translateY(-2px)}
.mode:active{transform:translateY(1px)}
.mode h3{font-size:1.25rem}
.mode p{margin:0;font-size:.85rem;color:var(--muted)}
.mode.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.mode.primary p{color:var(--accent-ink);opacity:.8}
.mode.blitz{background:var(--coral);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.mode.blitz p{color:#fff;opacity:.9}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{font-size:1.3rem}
.sect span{font-size:.8rem;color:var(--muted)}
.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.ch:hover{border-color:var(--accent)}
.chhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chhead strong{font-weight:600;font-size:1rem;line-height:1.3}
.code{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.mbar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--good)} .mbar .l{background:var(--accent)}
.chfoot{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chfoot a{color:var(--muted)}
.tip{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
.tip b{color:var(--ink)}
/* play */
.hud{display:flex;align-items:center;gap:12px}
.quit{background:none;border:0;font-size:1.4rem;padding:0 4px;color:var(--muted)}
.prog{flex:1;height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.combo{font-family:var(--display);font-weight:800;font-size:1.2rem;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.combo.hot{color:var(--coral)}
.timer{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 3px 0 var(--line)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qmeta .again{color:var(--coral)}
.q{font-size:1.35rem;font-weight:600;line-height:1.4;margin:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.05rem;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt kbd{font-family:var(--display);font-weight:800;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font-size:.9rem;flex:none}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.ok kbd{background:var(--good);color:#fff}
.opt.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .3s}
.opt.no kbd{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-weight:800;font-size:1.5rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.hook{background:var(--hook-bg);border-radius:12px;padding:12px 14px;font-size:.98rem}
.hook b{font-family:var(--display);letter-spacing:.04em;font-size:.8rem;text-transform:uppercase;display:block;color:var(--muted)}
.next{align-self:stretch;border:0;border-radius:14px;padding:14px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1.2rem}
.next small{font-family:var(--body);font-weight:500;opacity:.6;font-size:.8rem}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:3rem;color:var(--coral);pointer-events:none;animation:pop .9s forwards;z-index:20;text-shadow:0 3px 0 var(--surface)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* end */
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1}
.endgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.endgrid div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.endgrid b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.endgrid span{font-size:.75rem;color:var(--muted)}
.missed{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.missed li{border-left:4px solid var(--coral);padding:4px 10px;font-size:.92rem}
.missed li em{font-style:normal;font-weight:700;color:var(--good)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .next{flex:1;min-width:140px}
.ghost{background:var(--sunk)!important;color:var(--ink)!important}
/* cram */
.cram{display:flex;flex-direction:column;gap:8px}
.cf{background:var(--surface);border-radius:12px;padding:10px 14px;border:1px solid var(--line)}
.cf p{margin:0;font-size:.95rem}
.cf .a{font-weight:700;color:var(--good)}
.cf .h{font-size:.85rem;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.85rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xfer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.xfer h3{font-size:1.15rem}
.xfer p{margin:0;font-size:.88rem;color:var(--muted)}
.xfer textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;word-break:break-all}
.xfer .row button{flex:1;min-width:140px}
.msg{font-size:.88rem;font-weight:600;min-height:1.2em}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:560px){.modes{grid-template-columns:1fr}.chapters{grid-template-columns:1fr}.board{grid-template-columns:1fr;justify-items:start}.q{font-size:1.18rem}.big{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<canvas id="fx"></canvas>
<div class="wrap" id="app"></div>

<script>
/* ======================= FACT BANK =======================
   Format per line:  question ~ correct ~ wrong1|wrong2|wrong3 ~ memory hook (optional)
*/
const CH = [
{id:"b1",code:"BD·01",t:"বাংলাদেশ দিনপঞ্জি",d:`
বাংলাদেশ ও উরুগুয়ের মধ্যে প্রথম দ্বিপক্ষীয় পরামর্শ সভা ও MoU কবে? ~ ০৭ জানুয়ারি ২০২৬ ~ ১২ জানুয়ারি ২০২৬|২৫ জানুয়ারি ২০২৬|০৬ ফেব্রুয়ারি ২০২৬ ~ বছরের ৭ নম্বর দিনেই উরুগুয়ের সাথে হাত মেলানো: "Uru-7".
১২ জানুয়ারি ২০২৬ কোন তিন অঞ্চলের উন্নয়ন কর্তৃপক্ষ গঠিত হয়? ~ বরিশাল, রংপুর ও ময়মনসিংহ ~ রাজশাহী, সিলেট ও ময়মনসিংহ|রংপুর, বগুড়া ও কুমিল্লা|চট্টগ্রাম, খুলনা ও বরিশাল ~ "BRM" = Barishal-Rangpur-Mymensingh, তিনটাই পিছিয়ে পড়া অঞ্চল।
২৫ জানুয়ারি ২০২৬ কোন অধ্যাদেশ জারি হয়? ~ জুলাই গণঅভ্যুত্থানকারীদের দায়মুক্তি অধ্যাদেশ ~ জুলাই স্মৃতি জাদুঘর অধ্যাদেশ|সাইবার সুরক্ষা অধ্যাদেশ|সরকারি চাকরি অধ্যাদেশ ~ ২৫ জানুয়ারি = দায়মুক্তি + সাফ নারী ফুটসাল জয়, একই দিনে ডাবল খবর।
দীর্ঘ কত বছর পর ঢাকা-করাচি রুটে বিমানের ফ্লাইট চালু হয় (২৯ জানুয়ারি)? ~ ১৪ বছর ~ ১০ বছর|১৬ বছর|১২ বছর ~ করাচি ১৪, বৃত্তি পরীক্ষা ১৬, চ্যানেল ওয়ান ১৬। শুধু করাচি "চৌদ্দ"।
২০২৩ সালের জাতীয় চলচ্চিত্র পুরস্কার কবে ঘোষণা করা হয়? ~ ২৯ জানুয়ারি ২০২৬ ~ ২৫ জানুয়ারি ২০২৬|০৫ এপ্রিল ২০২৬|২১ ফেব্রুয়ারি ২০২৬ ~ করাচি ফ্লাইট আর সিনেমা অ্যাওয়ার্ড একই দিন (২৯ জানু): প্লেনে বসে সিনেমা।
দেশের প্রথম MVNO সিম কোন প্রতিষ্ঠানের মালিকানাধীন? ~ বিটিসিএল (BTCL) ~ বিটিআরসি (BTRC)|টেলিটক|গ্রামীণফোন ~ টাওয়ার নেই, অন্যের নেটওয়ার্কে চলে = ভার্চুয়াল। মালিক BTCL (L = Limited কোম্পানি, R = Regulator না)।
বাংলাদেশ-জাপান অর্থনৈতিক অংশীদারত্ব চুক্তি (EPA) কোথায় স্বাক্ষরিত? ~ টোকিও ~ ঢাকা|কিয়োটো|ওসাকা ~ জাপানের চুক্তি জাপানের রাজধানীতে, ০৬ ফেব্রুয়ারি।
বাংলাদেশ-যুক্তরাষ্ট্র "Agreement on Reciprocal Trade (ART)" কবে স্বাক্ষরিত? ~ ০৯ ফেব্রুয়ারি ২০২৬ ~ ০৬ ফেব্রুয়ারি ২০২৬|০৩ ফেব্রুয়ারি ২০২৬|২৬ ফেব্রুয়ারি ২০২৬ ~ জাপান ০৬, আমেরিকা ০৯। ৬ উল্টালে ৯: দুই চুক্তি একে অপরের উল্টো ছবি।
একুশে বইমেলা ২০২৬ এর প্রতিপাদ্য কী? ~ বহুমাত্রিক বাংলাদেশ ~ পড়ো বই, গড়ো দেশ|জ্ঞান ও সৃজনশীলতার বিকাশে বই|জেগে উঠুক বাংলাদেশ ~ উদ্বোধন করেন প্রধানমন্ত্রী তারেক রহমান, ২৬ ফেব্রুয়ারি। বই = অনেক মাত্রা।
ফ্যামিলি কার্ড বিতরণ কর্মসূচির উদ্বোধন কোথায় হয়? ~ কড়াইল বস্তি ~ টাঙ্গাইল|কামরাঙ্গীরচর|মিরপুর ~ ১০ মার্চ। ফ্যামিলি কার্ড = কড়াইল, কৃষক কার্ড = টাঙ্গাইল। K-K মেলে না, তাই উল্টো মনে রাখো।
ত্রয়োদশ জাতীয় সংসদের প্রথম অধিবেশন শুরু কবে? ~ ১২ মার্চ ২০২৬ ~ ১০ মার্চ ২০২৬|১৫ মার্চ ২০২৬|০৫ এপ্রিল ২০২৬ ~ ১৩তম সংসদ, শুরু ১২ তারিখে: ১৩-এর ঠিক এক ধাপ আগে।

/* ---- cross-device sync ----
   On claude.ai: the viewer's private artifact store (no setup).
   On a self-hosted site: Google sign-in + Firestore through SYNC_MODULE, if set. */

let BACK=null,SYNC="local",SYNC_MSG="",USER=null,FB=null,UNWATCH=null,syncT=null,writing=Promise.resolve(),lastSent="";
function merge(a,b){
  const aw=a.wiped||0,bw=b.wiped||0;
  if(aw!==bw){ /* a reset happened on one device: drop the other side's history from before it */
    const w=Math.max(aw,bw),old=aw<bw?a:b,keep={xp:0,best:0,days:[],seen:{},box:{},due:{},at:{}};
    Object.keys(old.at||{}).forEach(id=>{if(old.at[id]>w){keep.at[id]=old.at[id];keep.seen[id]=1;if(id in (old.box||{}))keep.box[id]=old.box[id];if(id in (old.due||{}))keep.due[id]=old.due[id];}});
    keep.wiped=w;keep.sound=old.sound;
    if(aw<bw)a=keep;else b=keep;
  }
  const o={wiped:Math.max(aw,bw)||undefined,xp:Math.max(a.xp||0,b.xp||0),best:Math.max(a.best||0,b.best||0),sound:a.sound,
    days:[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-60),
    seen:Object.assign({},b.seen,a.seen),box:{},due:{},at:{}};
  const ids=new Set([...Object.keys(a.box||{}),...Object.keys(b.box||{}),...Object.keys(a.at||{}),...Object.keys(b.at||{})]);
  ids.forEach(id=>{const src=((b.at||{})[id]||0)>((a.at||{})[id]||0)?b:a;
    if(src.box&&id in src.box)o.box[id]=src.box[id]; if(src.due&&id in src.due)o.due[id]=src.due[id]; if(src.at&&id in src.at)o.at[id]=src.at[id];});
  return o;
}

async function initSync(){
  try{
    if(window.claude&&window.claude.use){
      setSync("connecting");
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const uid=db&&user?await user.id():null;
      if(!uid){setSync("local");return;}
      const ref=db.doc("data/users/"+uid+"/"+KEY);
      await attach({
        get:async()=>{const s=await ref.get();return s.exists?s.data().state:null;},
        set:body=>ref.set({state:body,updatedAt:Date.now()}),
        watch:(cb,err)=>ref.onSnapshot(sn=>{if(sn.exists&&!sn.metadata.hasPendingWrites)cb(sn.data().state);},err)
      });

    }
    if(!SYNC_MODULE||SYNC_MODULE.startsWith("__")) return;
    setSync("connecting");
    FB=await import(SYNC_MODULE);
    FB.onUser(async u=>{
      if(UNWATCH){try{UNWATCH();}catch(e){}UNWATCH=null;}
      BACK=null;USER=u;
      if(!u){setSync("signin");return;}
      setSync("connecting");
      try{
        const d=FB.deck(KEY);
        await attach({
          get:async()=>{const x=await d.get();return x?x.state:null;},
          set:body=>d.set({state:body,updatedAt:Date.now()}),
          watch:(cb,err)=>d.watch(x=>cb(x.state),err)
        });
      }catch(e){setSync("error",FB.explain(e));}
    });

}

const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;}resize();addEventListener("resize",resize);
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#FFB020","#FF5E5B","#16A06A","#5B8CFF","#FFFFFF"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[i%5],life:80});
  if(parts.length===n) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.life--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*.6);});
  parts=parts.filter(p=>p.life>0);
  if(parts.length) requestAnimationFrame(tick); else cx.clearRect(0,0,cv.width,cv.height);
}

function pickSmart(pool,n){
  const now=Date.now();
  const due=pool.filter(id=>S.seen[id]&&box(id)<6&&(S.due[id]||0)<=now).sort((a,b)=>box(a)-box(b));
  const fresh=pool.filter(id=>!S.seen[id]);
  const out=[...shuffle(due).sort((a,b)=>box(a)-box(b)).slice(0,Math.ceil(n*.5)),...fresh.slice(0,n)];
  let res=[...new Set(out)].slice(0,n);
  if(res.length<n){const rest=shuffle(pool.filter(id=>!res.includes(id))).sort((a,b)=>box(a)-box(b));res=res.concat(rest.slice(0,n-res.length));}
  return shuffle(res);
}

  const weak=FACTS.filter(f=>S.seen[f.id]&&box(f.id)<=1).length;
  app.innerHTML=`
  <div class="top"><div class="brand"><a href="../" aria-label="Back to dashboard" style="text-decoration:none;color:var(--muted);margin-right:8px">←</a>GK <b>Brain</b> Install</div>
    <div class="row"><button class="iconbtn" id="xfer">Export / Import</button><button class="iconbtn" id="snd">${S.sound?"Sound on":"Sound off"}</button><button class="iconbtn" id="reset">Reset</button></div></div>
  <section class="board" aria-label="Your progress">
    <div class="lvl"><div><small>Level</small><span>${L.l}</span></div></div>
    <div class="stats">
      <div class="chips"><span class="chip"><b>${S.xp}</b> XP</span><span class="chip">Streak <b>${streak()}</b> day${streak()===1?"":"s"}</span><span class="chip">Blitz best <b>${S.best}</b></span></div>
      <div class="xpbar" aria-label="XP to next level"><i style="width:${(L.into/L.need*100).toFixed(1)}%"></i></div>
      <div class="chips" id="syncwrap">${syncChip()}</div>
      <div class="chips"><span class="chip">Locked in <b>${m}</b>/${tot}</span><span class="chip">Seen <b>${seen}</b></span><span class="chip">Due now <b>${dueN}</b></span></div>
    </div>
  </section>
  <div class="modes">
    <button class="mode primary" id="go"><h3>Quick 10</h3><p>Due reviews first, then new facts. Best default.</p></button>
    <button class="mode blitz" id="blitz"><h3>60s Blitz</h3><p>Correct +2s, wrong −3s. Beat ${S.best}.</p></button>
    <button class="mode" id="weak" ${weak?"":"disabled style='opacity:.5'"}><h3>Weak spots</h3><p>${weak} facts you keep missing.</p></button>
  </div>
  <div class="tip"><b>How this installs:</b> every miss comes back 3 questions later and the round won't end until you nail it. Facts you get right come back after 5 min, 30 min, 6 h, 1 day, 3 days, then 7 days. Three correct spaced hits = locked in. Keys <b>1–4</b> answer, <b>Enter</b> moves on. <b>Export / Import</b> gives you a code to carry progress to any device.</div>
  <div class="sect"><h2>Levels</h2><span>${CH.length} chapters · tap one to drill it</span></div>
  <div class="chapters">${CH.map(c=>{
    const n=c.ids.length,mm=c.ids.filter(mastered).length,ll=c.ids.filter(id=>S.seen[id]&&!mastered(id)).length;
    return `<div class="ch"><button class="chgo" data-c="${c.id}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px">
      <div class="chhead"><strong>${c.t}</strong><span class="code">${c.code}</span></div>
      <div class="mbar"><i class="m" style="width:${mm/n*100}%"></i><i class="l" style="width:${ll/n*100}%"></i></div></button>
      <div class="chfoot"><span>${bn(mm)}/${bn(n)} locked</span><a href="#" data-cram="${c.id}">Cram sheet</a></div></div>`;}).join("")}
  </div>`;
  bindSync();
  $("#go").onclick=()=>start(pickSmart(FACTS.map(f=>f.id),10),"Quick 10");
  $("#blitz").onclick=()=>start(shuffle(FACTS.filter(f=>S.seen[f.id]).length>=20?FACTS.filter(f=>S.seen[f.id]).map(f=>f.id):FACTS.map(f=>f.id)),"Blitz",true);
  $("#weak").onclick=()=>{const w=shuffle(FACTS.filter(f=>S.seen[f.id]&&box(f.id)<=1).map(f=>f.id)).slice(0,10);if(w.length)start(w,"Weak spots");};
  $("#snd").onclick=()=>{S.sound=!S.sound;save();home();};
  $("#xfer").onclick=xferView;
  $("#reset").onclick=e=>{
    if(e.target.dataset.arm){const t=Date.now(),at={};Object.keys(S.at||{}).forEach(id=>at[id]=t);S={xp:0,box:{},seen:{},due:{},at,best:0,days:[],sound:S.sound,wiped:t};save();home();}
    else{e.target.dataset.arm=1;e.target.textContent="Tap again to wipe";setTimeout(()=>{if(e.target.isConnected){delete e.target.dataset.arm;e.target.textContent="Reset";}},2500);}
  };
  app.querySelectorAll(".chgo").forEach(b=>b.onclick=()=>{const c=CH.find(x=>x.id===b.dataset.c);start(pickSmart(c.ids,10),c.t);});
  app.querySelectorAll("[data-cram]").forEach(a=>a.onclick=e=>{e.preventDefault();cram(a.dataset.cram);});
  scrollTo(0,0);
}

/* ======================= CRAM ======================= */
function cram(cid){
  app.innerHTML=`<div class="top"><button class="iconbtn" id="back">← Back</button><div class="brand" style="font-size:1.2rem">Cram sheet</div></div>
  <div class="tabs">${CH.map(c=>`<button data-c="${c.id}" aria-pressed="${c.id===cid}">${c.code}</button>`).join("")}</div>
  <div class="sect"><h2>${CH.find(c=>c.id===cid).t}</h2><span>Read once, then drill</span></div>
  <div class="cram">${CH.find(c=>c.id===cid).ids.map(id=>{const f=BYID[id];return `<div class="cf"><p>${esc(f.q)}</p><p class="a">${esc(f.a)}</p>${f.h?`<p class="h">${esc(f.h)}</p>`:""}</div>`;}).join("")}</div>
  <button class="next" id="drill">Drill this chapter</button>`;
  $("#back").onclick=home;
  $("#drill").onclick=()=>{const c=CH.find(x=>x.id===cid);start(pickSmart(c.ids,10),c.t);};
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>cram(b.dataset.c));
  scrollTo(0,0);
}

/* ======================= PROGRESS CODE ======================= */
const CODE_TAG="BI1";
function b64(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
function unb64(t){const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function makeCode(){
  const raw=new TextEncoder().encode(JSON.stringify(S));
  if(window.CompressionStream){try{
    const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
    return CODE_TAG+"z."+KEY+"."+b64(z);}catch(e){}}
  return CODE_TAG+"p."+KEY+"."+b64(raw);
}
async function readCode(code){
  code=code.replace(/\s+/g,"");
  const m=code.match(/^BI1([zp])\.([A-Za-z0-9-]+)\.(.+)$/);
  if(!m) throw new Error("That doesn't look like a progress code. Copy the whole code, from BI1 to the end.");
  if(m[2]!==KEY) throw new Error("That code belongs to a different deck ("+m[2]+").");
  let bytes=unb64(m[3]);
  if(m[1]==="z"){
    if(!window.DecompressionStream) throw new Error("This browser can't open compressed codes. Try a current Chrome, Safari, Edge or Firefox.");
    bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  }
  const obj=JSON.parse(new TextDecoder().decode(bytes));
  if(!obj||typeof obj!=="object"||!obj.box) throw new Error("That code is damaged. Export it again on the other device.");
  return obj;
}
function xferView(){
  run=null;
  app.innerHTML=`<div class="top"><button class="iconbtn" id="back">← Back</button><div class="brand" style="font-size:1.2rem">Export / Import progress</div></div>
  <div class="tip">Use this to carry progress to a device or browser that isn't synced. Export a code on one device, then import it on the other. Importing merges: for each fact the most recent answer wins, and XP and best scores keep the higher number. Nothing is lost on either side.</div>
  <section class="xfer"><h3>Export progress</h3><p>${FACTS.filter(f=>S.seen[f.id]).length} facts seen, ${S.xp} XP.</p>
    <textarea id="outcode" readonly aria-label="Your progress code">Making code…</textarea>
    <div class="row"><button class="next" id="copy">Copy export code</button></div><div class="msg" id="omsg"></div></section>
  <section class="xfer"><h3>Import progress</h3><p>Paste a code you exported from another device.</p>
    <textarea id="incode" placeholder="BI1z.…" aria-label="Paste an exported progress code"></textarea>
    <div class="row"><button class="next" id="merge">Import and merge</button></div><div class="msg" id="imsg"></div></section>`;
  $("#back").onclick=home;
  makeCode().then(c=>{$("#outcode").value=c;});
  $("#copy").onclick=async()=>{
    const ta=$("#outcode"),m=$("#omsg");
    try{await navigator.clipboard.writeText(ta.value);m.className="msg ok";m.textContent="Copied. Import it on your other device.";}
    catch(e){ta.focus();ta.select();m.className="msg";m.textContent="Your browser blocked copying. The code is selected: press Ctrl+C (or ⌘C), or long-press and Copy.";}
  };
  $("#merge").onclick=async()=>{
    const m=$("#imsg");
    try{
      const other=await readCode($("#incode").value);
      const before=FACTS.filter(f=>S.seen[f.id]).length;
      S=merge(S,other);S.at=S.at||{};save();
      const after=FACTS.filter(f=>S.seen[f.id]).length;
      $("#incode").value="";m.className="msg ok";m.textContent="Imported. Facts seen: "+before+" → "+after+". XP now "+S.xp+".";
      makeCode().then(c=>{$("#outcode").value=c;});
      burst(40);
    }catch(e){m.className="msg no";m.textContent=e.message||"That code couldn't be read. Export it again on the other device.";}
  };
  scrollTo(0,0);
}

/* ======================= PLAY ======================= */
let run=null,timerH=null;
function start(ids,label,blitz=false){
  if(!S.days.includes(todayStr())){S.days.push(todayStr());S.days=S.days.slice(-60);save();}
  run={q:ids.slice(),label,blitz,done:0,total:ids.length,combo:0,maxCombo:0,xp:0,right:0,wrong:0,missed:[],again:new Set(),locked:0,time:60,cur:null,answered:false};
  if(blitz){clearInterval(timerH);timerH=setInterval(()=>{if(!run||!run.blitz){clearInterval(timerH);return;}run.time--;const t=$("#tm");if(t)t.textContent=Math.max(0,run.time)+"s";if(run.time<=0){clearInterval(timerH);end();}},1000);}
  next();
}
function next(){
  if(!run) return;
  if(!run.q.length){ if(run.blitz){run.q=shuffle(FACTS.map(f=>f.id));} else return end(); }
  const id=run.q.shift(),f=BYID[id];
  run.cur=f;run.answered=false;
  const opts=shuffle([f.a,...f.w.slice(0,3)]);
  run.opts=opts;
  const pct=run.blitz?100:(run.done/(run.total)*100);
  app.innerHTML=`
  <div class="hud"><button class="quit" id="quit" aria-label="Quit round">✕</button>
    ${run.blitz?`<div class="timer" id="tm">${run.time}s</div><div class="prog"><i style="width:${Math.max(0,run.time)/60*100}%"></i></div>`:`<div class="prog"><i style="width:${pct}%"></i></div>`}
    <div class="combo ${run.combo>=3?"hot":""}" id="cb">${run.combo>=2?"×"+run.combo:""}</div></div>
  <div class="card">
    <div class="qmeta"><span>${CH.find(c=>c.id===f.ch).code} · ${CH.find(c=>c.id===f.ch).t}</span>${run.again.has(id)?'<span class="again">Again! You missed this one</span>':(!S.seen[id]?"<span>New</span>":"")}</div>
    <p class="q">${esc(f.q)}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  $("#quit").onclick=()=>{clearInterval(timerH);home();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(!run||run.answered) return;
  run.answered=true;
  const f=run.cur,ok=run.opts[i]===f.a,btns=app.querySelectorAll(".opt");
  btns.forEach((b,j)=>{b.disabled=true;if(run.opts[j]===f.a)b.classList.add("ok");});
  if(!ok) btns[i].classList.add("no");
  S.seen[f.id]=1;S.at[f.id]=Date.now();
  if(ok){
    run.combo++;run.maxCombo=Math.max(run.maxCombo,run.combo);run.right++;
    const gain=10+Math.min(run.combo,10)*2;run.xp+=gain;S.xp+=gain;
    if(!run.again.has(f.id)){const before=box(f.id);S.box[f.id]=Math.min(6,before+1);if(before<3&&S.box[f.id]>=3)run.locked++;}
    S.due[f.id]=Date.now()+IV[box(f.id)];
    if(run.blitz) run.time+=2;
    beep(true,run.combo);
    if(run.combo===5||run.combo===10||run.combo===20){burst(run.combo*6);popText("COMBO ×"+run.combo);}
  }else{
    run.combo=0;run.wrong++;S.box[f.id]=0;S.due[f.id]=Date.now();
    if(!run.missed.includes(f.id))run.missed.push(f.id);
    if(!run.blitz){run.q.splice(Math.min(3,run.q.length),0,f.id);run.again.add(f.id);}
    else run.time-=3;
    beep(false,0);
  }
  if(!run.blitz && (ok && !run.q.includes(f.id))) run.done++;
  save();
  const cb=$("#cb");if(cb){cb.textContent=run.combo>=2?"×"+run.combo:"";cb.className="combo"+(run.combo>=3?" hot":"");}
  if(run.blitz){ setTimeout(()=>{if(run&&run.time>0)next();},ok?350:1400); if(!ok){$("#fb").innerHTML=`<div class="hook"><b>Answer</b>${esc(f.a)}</div>`;} return; }
  const praise=["Locked!","Yes!","Nailed it","Boom","Correct","Easy"];const roast=["Nope","Not quite","Missed","Wrong one"];
  $("#fb").innerHTML=`<div class="fb">
    <div class="verdict ${ok?"ok":"no"}">${ok?praise[Math.random()*praise.length|0]:roast[Math.random()*roast.length|0]+" · it'll come back in 3"}</div>
    ${f.h?`<div class="hook"><b>Memory hook</b>${esc(f.h)}</div>`:""}
    <button class="next" id="nx">Next <small>(Enter)</small></button></div>`;
  $("#nx").onclick=next;$("#nx").focus({preventScroll:true});
  $("#fb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function end(){
  clearInterval(timerH);
  if(!run) return;
  const r=run;run=null;
  let newBest=false;
  if(r.blitz&&r.right>S.best){S.best=r.right;newBest=true;save();}
  const acc=r.right+r.wrong?Math.round(r.right/(r.right+r.wrong)*100):0;
  if(acc>=80||newBest) burst(90);
  app.innerHTML=`<div class="card">
    <div class="qmeta"><span>${esc(r.label)} complete</span></div>
    <div class="big">${r.blitz?(newBest?"New record: ":"")+r.right+" correct":"+"+r.xp+" XP"}</div>
    <div class="endgrid"><div><b>${acc}%</b><span>First-try accuracy</span></div><div><b>×${r.maxCombo}</b><span>Best combo</span></div><div><b>${r.locked}</b><span>Newly locked in</span></div></div>
    ${r.missed.length?`<h3>Burn these in</h3><ul class="missed">${r.missed.map(id=>{const f=BYID[id];return `<li>${esc(f.q)}<br><em>${esc(f.a)}</em></li>`;}).join("")}</ul>`:"<p>Clean round. Nothing missed.</p>"}
    <div class="row"><button class="next" id="again">Another 10</button><button class="next ghost" id="hm">Home</button></div>
  </div>`;
  $("#again").onclick=()=>start(pickSmart(FACTS.map(f=>f.id),10),"Quick 10");
  $("#hm").onclick=home;
  scrollTo(0,0);
}
addEventListener("keydown",e=>{
  if(!run) return;
  if(!run.answered&&["1","2","3","4"].includes(e.key)){answer(+e.key-1);}
  else if(run.answered&&!run.blitz&&(e.key==="Enter"||e.key===" ")){e.preventDefault();next();}
});
home();
initSync();
</script>
